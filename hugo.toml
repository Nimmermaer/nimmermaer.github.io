baseURL = 'https://nimmermaer.github.io/'
locale = 'de-de'
title = 'Michael Blunck'
publishDir = 'public'
theme = "careercanvas"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false

[languages]
  [languages.de]
    contentDir = "content"
    label = "Deutsch" # Gefixt: Ersetzt languageName
    weight = 1
    [languages.de.params]
      tagline = "Web Developer & Fachinformatiker. Jede gelöschte Zeile Code ist eine gute Zeile Code."
      hero_description = "Leidenschaftlicher Entwickler mit Fokus auf cleanen Code, moderne Webstandards und performante Architekturen."
      hero_location = "Köln, Deutschland"
      collab_tags = ["TYPO3", "TypeScript", "Vite", "HTMX"]

[build]
  writeStats = true

[params]
  name = "Michael Blunck"
  email = "mi.blunck@gmail.com"
  profile_image = "/images/your-profile.jpg" # Hier später dein Bild hinterlegen
  author = "Michael Blunck"
  og_image = "images/your-og.png"
  description = "Portfolio von Michael Blunck - Webentwicklung und IT-Architektur."
  linkedin_url = "" # Kannst du füllen, falls vorhanden
  linkedin_text = ""
  github_url = "https://github.com/nimmermaer"
  github_text = "github.com/nimmermaer"
  calendly_url = ""
  calendly_height = "700px"
  copyright = "© 2026 | Michael Blunck"
  resume_url_en = "/files/your-cv-en.pdf"
  resume_url_fr = "/files/your-cv-fr.pdf"
  resume_label = "CV anzeigen"
  sectionPagesMenu = "main"
  formspreeendpoint = ""
  pexelsapikey = "" # Wenn du hier keinen Key einträgst, nutzt das Theme lokale Fallback-Bilder

  [[params.social]]
    icon = "github"
    url = "https://github.com/nimmermaer"

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # Wichtig, falls du HTML direkt in Markdown nutzt
  [markup.highlight]
    style = "monokai"

[server]
  [[server.headers]]
    for = "/**/*.css"
    [server.headers.values]
      Content-Type = "text/css"

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']

# Das Theme würfelt bei jedem Laden eine Farbpalette aus.
[params.color_palettes]
  [[params.color_palettes.palette]]
    name = "professional"
    main_color = "#474A51"
    second_color = "#E52521"
    third_color = "#3CB043"
  [[params.color_palettes.palette]]
    name = "ocean"
    main_color = "#1E40AF"
    second_color = "#06B6D4"
    third_color = "#10B981"
  [[params.color_palettes.palette]]
    name = "steel"
    main_color = "#374151"
    second_color = "#6B7280"
    third_color = "#10B981"
  [[params.color_palettes.palette]]
    name = "slate"
    main_color = "#475569"
    second_color = "#0EA5E9"
    third_color = "#F97316"

[params.pexels]
  queries = ["long span bridges", "skyscrapers", "sky and clouds"]